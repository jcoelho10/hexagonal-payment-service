spring:
  application:
    name: payment-service

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, metrics, resilience4j.circuitbreakers
  metrics:
    export:
      prometheus:
        enabled: true

  resilience4j:
    circuitbreaker:
      instances:
        paymentGateway:
          sliding-window-size: 10
          failure-rate-threshold: 50
          wait-duration-in-open-state: 10000ms
          permitted-number-of-calls-in-half-open-state: 3
          register-health-indicator: true
    retry:
      instances:
        paymentGateway:
          max-attempts: 3
          wait-duration: 500ms
          enable-exponential-backoff: true
          exponential-backoff-multiplier: 2